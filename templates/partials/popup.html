<div class="popup" data-popup="project" data-yandex-goal="start">
  <div class="popup__content">
    <button class="popup__close" data-popup-close aria-label="Закрыть">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path
          d="M18 6L6 18M6 6L18 18"
          stroke="#2B2A29"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <h2 class="popup__title">получить расчёт проекта</h2>

    <form
      class="popup__form"
      data-popup-form
      data-form-type="project"
      data-yandex-goal-success="form_submit_success"
    >
      <div class="popup__form-group">
        <input
          type="text"
          class="popup__input"
          name="company"
          placeholder="название компании"
        />
      </div>

      <div class="popup__form-group popup__form-group__area popup__form-group__area--project">
        <textarea
          rows="3"
          class="popup__input"
          name="project"
          placeholder="несколько слов о проекте и приблизительный бюджет"
        ></textarea>
      </div>

      <div class="popup__form-group">
        <input
          type="email"
          class="popup__input"
          name="email"
          placeholder="электронная почта"
        />
      </div>

      <div class="popup__form-group">
        <input
          type="tel"
          class="popup__input"
          name="phone"
          placeholder="телефон или любой удобный мессенджер *"
        />
      </div>

      <div class="popup__form-group">
        <input type="text" class="popup__input" name="name" placeholder="имя *" />
      </div>

      <div class="popup__form-group popup__form-group--project-select">
        <div class="popup__project-select" data-project-select>
          <button
            type="button"
            class="popup__project-select-trigger"
            data-project-select-trigger
            aria-expanded="false"
            aria-haspopup="true"
          >
            <span
              class="popup__project-select-summary is-placeholder"
              data-project-select-summary
              data-placeholder="новый проект"
            >
              новый проект
            </span>
            <span class="popup__project-select-icon" aria-hidden="true"></span>
          </button>

          <div
            class="popup__project-select-menu"
            data-project-select-menu
            role="group"
            aria-label="Новый проект"
            hidden
          >
            <label class="popup__project-select-option">
              <input
                type="checkbox"
                class="popup__project-select-checkbox"
                data-project-select-checkbox
                value="музей/интерактивное пространство"
              />
              <span>музей/интерактивное пространство</span>
            </label>
            <label class="popup__project-select-option">
              <input
                type="checkbox"
                class="popup__project-select-checkbox"
                data-project-select-checkbox
                value="застройка выставок"
              />
              <span>застройка выставок</span>
            </label>
            <label class="popup__project-select-option">
              <input
                type="checkbox"
                class="popup__project-select-checkbox"
                data-project-select-checkbox
                value="проектирование и дизайн"
              />
              <span>проектирование и дизайн</span>
            </label>
            <label class="popup__project-select-option">
              <input
                type="checkbox"
                class="popup__project-select-checkbox"
                data-project-select-checkbox
                value="создание контента и анимация"
              />
              <span>создание контента и анимация</span>
            </label>
            <label class="popup__project-select-option">
              <input
                type="checkbox"
                class="popup__project-select-checkbox"
                data-project-select-checkbox
                value="разработка приложений и ПО"
              />
              <span>разработка приложений и ПО</span>
            </label>
            <label class="popup__project-select-option">
              <input
                type="checkbox"
                class="popup__project-select-checkbox"
                data-project-select-checkbox
                value="тех. сопровождение и обслуживание"
              />
              <span>тех. сопровождение и обслуживание</span>
            </label>
            <label class="popup__project-select-option">
              <input
                type="checkbox"
                class="popup__project-select-checkbox"
                data-project-select-checkbox
                value="доступная среда"
              />
              <span>доступная среда</span>
            </label>
          </div>
        </div>
      </div>

      <div class="popup__form-group popup__form-group--file">
        <input
          type="file"
          class="popup__input popup__input--file"
          data-form-file-input
          multiple
        />
        <span class="popup__file-name" data-form-file-label>
          Приложить файлы (до 10 Мб.)
        </span>
      </div>

      <div class="popup__button">
        <button type="submit" class="popup__submit">
          отправить заявку
        </button>
      </div>

      <div class="consent-container">
        <label class="consent-text">
          Нажимая кнопку "отправить заявку" вы соглашаетесь с
          <a href="/legal/personal-data/" class="privacy-link">
            Обработкой персональных данных
          </a>
          и
          <a href="/legal/privacy-policy/" class="privacy-link">
            Политикой Конфиденциальности
          </a>
        </label>
      </div>

      <div class="popup__icon">
        <img
          src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
          data-src="https://cultnova-media.hb.ru-msk.vkcloud-storage.ru/site-icons/popup-laptop.webp"
          alt="decor"
          class="popup__decor"
          loading="lazy"
          decoding="async"
          fetchpriority="low"
        />
      </div>
    </form>
  </div>
</div>
